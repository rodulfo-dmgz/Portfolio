<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
<meta name="author" content="Rodulfo Dominguez" />
<meta property="og:site_name" content="Rodulfo Dominguez" />
<meta property="og:locale" content="fr_FR" />
<link rel="icon" href="/assets/icons/favicon-32.png" type="image/png" sizes="32x32" />
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png" />
<link rel="preload" href="/assets/fonts/CabinetGrotesk-Variable.woff2" as="font" type="font/woff2" crossorigin />
<link rel="preload" href="/assets/fonts/Switzer-Variable.woff2" as="font" type="font/woff2" crossorigin />
<link rel="preload" href="/assets/fonts/SpaceMono-Regular.woff2" as="font" type="font/woff2" crossorigin />
<script>
  (function () {
    document.documentElement.classList.add('js');
    try {
      var choix = localStorage.getItem('rd-theme');
      var systeme = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (choix === 'dark' || (choix !== 'light' && systeme)) document.documentElement.classList.add('dark');
    } catch (e) {}
  })();
</script>
<link rel="stylesheet" href="/src/styles/main.css" />
