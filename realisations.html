<!doctype html>
<html lang="fr">
  <head>
    <!--@include head-->
    <title>Réalisations — Rodulfo Dominguez</title>
    <meta name="description" content="Réalisations en ingénierie pédagogique, conception de parcours, formation professionnelle et digital learning." />
    <meta property="og:title" content="Réalisations — Rodulfo Dominguez" />
    <meta property="og:description" content="Réalisations en ingénierie pédagogique, conception de parcours et digital learning." />
    <meta property="og:type" content="website" />
  </head>
  <body data-page="realisations" class="ecran-unique" data-fond>
    <a class="skip-link" href="#contenu">Aller au contenu</a>
    <!--@include header-->

    <main id="contenu" class="realisations-ecran">
      <div class="fond-ecran" aria-hidden="true">
        <div class="fond-ecran__pluie" data-pluie></div>
        <div class="fond-ecran__orbites" data-orbites></div>
      </div>

      <div class="realisations-ecran__contenu" data-bureau>
        <header class="realisations-ecran__texte">
          <p class="eyebrow" data-scramble>{{profil.titre}}</p>
          <h1 class="page-tete__titre">Réalisations</h1>
          <p class="page-tete__intro">Mes projets en ligne, comme sur mon bureau : un raccourci par projet, ouvert dans le navigateur de l’ordinateur.</p>

          <div class="bureau-zone__commandes" role="status" data-commandes>
            <p data-aide>Cliquez sur un raccourci pour l’ouvrir.</p>
            <div class="bureau-zone__actions" data-actions hidden>
              <a class="btn btn--outline" href="" target="_blank" rel="noopener noreferrer" data-externe>Ouvrir dans un nouvel onglet<span class="visually-hidden"> (nouvel onglet)</span><!--@icon arrow-up-right--></a>
              <a class="btn btn--outline" href="" data-etude>Lire l’étude de cas</a>
              <button class="btn btn--outline" type="button" data-fermer-nav>Fermer le navigateur</button>
            </div>
          </div>
        </header>

        <div class="ordinateur">
          <div class="ordinateur__cadre">
            <div class="ordinateur__ecran" data-ecran></div>
          </div>
          <div class="ordinateur__pied" aria-hidden="true"></div>
        </div>
      </div>
    </main>

    <!--@include footer-->
    <script type="module" src="/src/scripts/main.js"></script>
    <script type="module" src="/src/pages/realisations.js"></script>
  </body>
</html>
