<!doctype html>
<html lang="fr">
  <head>
    <!--@include head-->
    <title>Réalisations — Rodulfo Dominguez</title>
    <meta name="description" content="Réalisations en ingénierie pédagogique, conception de parcours, formation professionnelle et digital learning." />
    <meta property="og:title" content="Réalisations — Rodulfo Dominguez" />
    <meta property="og:description" content="Réalisations en ingénierie pédagogique, conception de parcours et digital learning." />
    <meta property="og:type" content="website" />
  </head>
  <body data-page="realisations">
    <a class="skip-link" href="#contenu">Aller au contenu</a>
    <!--@include header-->

    <main id="contenu">
      <header class="page-tete container">
        <p class="eyebrow">{{profil.titre}}</p>
        <h1 class="page-tete__titre">Réalisations</h1>
        <p class="page-tete__intro">Les projets de formation, de parcours et d'outils pédagogiques, classés par domaine.</p>
      </header>

      <section class="section container section--serree" aria-label="Liste des réalisations">
        <div class="filtres" role="group" aria-label="Filtrer par catégorie" data-rendu="filtres"></div>
        <p class="filtres__compte" role="status" data-compte></p>
        <div class="galerie" data-rendu="galerie"></div>

        <div class="etat-vide" data-vide hidden>
          <h2 class="etat-vide__titre" data-vide-titre></h2>
          <p>Les projets de cette catégorie seront ajoutés au fil des publications.</p>
          <button class="btn btn--outline" type="button" data-vide-action>Voir toutes les réalisations</button>
        </div>
      </section>
    </main>

    <!--@include footer-->
    <script type="module" src="/src/scripts/main.js"></script>
    <script type="module" src="/src/pages/realisations.js"></script>
  </body>
